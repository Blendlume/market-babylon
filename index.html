<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Babylon</title>
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babylon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#121110; --chrome-2:#1D1B18; --gold:#F2C230; --gold-2:#E0A91E; --brass:#B8892B; --ivory:#F4EEDF;
  --bg:#ECEAE4; --surface:#FFFFFF; --surface-2:#F4F2ED; --ink:#17140F; --muted:#686256; --line:rgba(23,20,15,.12);
  --accent-ink:#7A5A0C; --gold-line:#C9961A; --up:#B9402A; --down:#1C8058; --field:#FFFFFF;
  --shadow:0 1px 1px rgba(23,20,15,.04),0 8px 24px -10px rgba(23,20,15,.22);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E0C; --surface:#1A1815; --surface-2:#211F1B; --ink:#F4EEDF; --muted:#A39B8B; --line:rgba(244,238,223,.11);
    --accent-ink:#F2C230; --gold-line:#F2C230; --up:#F2785E; --down:#52C996; --field:#14120F;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E0C; --surface:#1A1815; --surface-2:#211F1B; --ink:#F4EEDF; --muted:#A39B8B; --line:rgba(244,238,223,.11);
  --accent-ink:#F2C230; --gold-line:#F2C230; --up:#F2785E; --down:#52C996; --field:#14120F;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--chrome) 50%,var(--bg) 50%)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* ---------- En-tête : l'enseigne ---------- */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 11px;background:var(--chrome);color:var(--ivory)}
.mark{line-height:1;min-width:0}
.mark b{display:block;font-family:var(--serif);font-style:italic;font-weight:700;font-size:23px;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 16px rgba(242,194,48,.32)}
.mark span{display:block;margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.26em;color:rgba(244,238,223,.78)}
.tiles{flex:none;height:12px;background-color:var(--chrome);background-image:linear-gradient(90deg,var(--brass) 0 8px,transparent 8px 11px);background-size:11px 8px;background-repeat:repeat-x;background-position:4px 0}
.pill{display:flex;align-items:center;gap:8px;border:1px solid rgba(244,238,223,.18);background:rgba(244,238,223,.05);color:var(--ivory);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
.pill i{width:8px;height:8px;border-radius:50%;background:#52C996;display:block;box-shadow:0 0 0 3px rgba(82,201,150,.18)}
.pill.pending i{background:var(--gold);box-shadow:0 0 0 3px rgba(242,194,48,.2)}
.pill.offline i{background:#8E877A;box-shadow:none}.pill.error i{background:#F2785E;box-shadow:0 0 0 3px rgba(242,120,94,.2)}
.pill.sync i{background:var(--ivory);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill[hidden]{display:none}

/* ---------- Mise en page ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 40px}
.h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.12;letter-spacing:-.005em;margin:4px 0 14px}
.h2{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;margin:30px 0 6px}
.lead{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 14px;max-width:62ch}
.small{font-size:13px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.foot{margin-top:30px;font-size:13px;color:var(--muted);padding-top:14px;border-top:1px dashed var(--line)}
.center{max-width:460px;margin:0 auto;padding:26px 20px 40px}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:13px 18px;border:0;border-radius:var(--r-md);background:var(--gold);color:#17140F;font-weight:800;font-size:16px;letter-spacing:.005em;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 22px -12px rgba(224,169,30,.9);transition:transform .12s ease,background-color .2s ease}
.btn:active{transform:scale(.985)}
.btn svg{width:22px;height:22px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--up);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{min-height:42px;padding:8px 14px;font-size:14px;width:auto;border-radius:var(--r-sm)}
.btn.sq{width:auto;padding:0 20px}
.back{background:none;border:0;padding:6px 0;color:var(--accent-ink);font-weight:800;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* ---------- Champs ---------- */
.field{margin-top:16px}
.field label{display:block;font-weight:800;font-size:13.5px;margin-bottom:7px}
.field label .opt{font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--field);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold-2);outline:none;box-shadow:0 0 0 4px rgba(242,194,48,.28)}
select:invalid,select.need{border-color:var(--gold-2);color:var(--muted)}
.row{display:flex;gap:8px}
.code{font-size:20px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}

/* ---------- Messages ---------- */
.err,.warn,.ok,.info{margin:12px 0 0;padding:11px 13px;border-radius:var(--r-sm);font-size:14.5px;line-height:1.45}
.err{background:color-mix(in srgb,var(--up) 13%,transparent);color:var(--up);font-weight:700}
.warn{background:rgba(242,194,48,.16);color:var(--accent-ink)}
.ok{background:color-mix(in srgb,var(--down) 13%,transparent);color:var(--down);font-weight:700}
.info{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}

/* ---------- Cartes, listes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:64px}
.item:first-child{border-top:0}
.item:active{background:var(--surface-2)}
.item .grow{flex:1;min-width:0}
.item .grow>span{display:block}
.item .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.item .pr small{font-family:var(--sans);font-size:11px;font-weight:800;color:var(--muted);margin-left:3px;letter-spacing:.05em}

.chips{display:flex;gap:8px;margin:14px -18px 0;padding:0 18px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chrome);border-color:var(--chrome);color:var(--gold)}

.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:2px}
.tag{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);color:var(--accent-ink)}
.tag.warn{border-color:transparent;background:rgba(242,194,48,.18);color:var(--accent-ink)}

/* ---------- Scan : le viseur ---------- */
.viewfinder{position:relative;background:var(--chrome);color:var(--ivory);border-radius:26px;padding:22px 20px 20px;border:1px solid rgba(242,194,48,.22);box-shadow:var(--shadow)}
.vf-zone{position:relative;aspect-ratio:16/8;margin:2px 0 18px;display:grid;place-items:center}
.vf-zone .c{position:absolute;width:30px;height:30px;border:3px solid var(--gold)}
.vf-zone .c1{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.vf-zone .c2{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.vf-zone .c3{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.vf-zone .c4{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.vf-zone svg{width:62%;height:auto;opacity:.22}
.vf-zone .beam{position:absolute;left:10%;right:10%;height:2px;top:50%;background:var(--gold);box-shadow:0 0 14px 2px rgba(242,194,48,.55);border-radius:2px;animation:beam 2.6s ease-in-out infinite}
@keyframes beam{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.vf-note{margin:12px 0 0;font-size:13px;color:rgba(244,238,223,.66);text-align:center}
.viewfinder .btn.ghost{color:var(--ivory);border-color:rgba(244,238,223,.2)}

/* ---------- Fiche produit : l'étiquette ---------- */
.ptitle{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.15;margin:4px 0 10px}
.pcard{margin-top:18px;background:var(--chrome);color:var(--ivory);border:1px solid rgba(242,194,48,.24);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.pcard .plabel{color:rgba(244,238,223,.66)}
.pcard .sub{color:rgba(244,238,223,.72)}
.plabel{font-size:13.5px;font-weight:800;color:var(--muted);margin:0}
.price{font-family:var(--serif);font-weight:700;font-size:56px;line-height:1;margin:10px 0 8px;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.price span{font-family:var(--sans);font-size:15px;font-weight:800;color:rgba(244,238,223,.7);margin-left:8px;letter-spacing:.08em}
.price.sm{font-size:36px}
.sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;margin-left:6px;vertical-align:1px}
.delta.up{background:rgba(242,120,94,.16);color:#F2785E}.delta.down{background:rgba(82,201,150,.16);color:#52C996}
.buy{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(244,238,223,.12)}
.buy strong{font-family:var(--serif);font-size:24px;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.marge{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:rgba(244,238,223,.72)}
.marge b{color:var(--ivory)}
.pcard input{background:#1D1B18;color:var(--ivory);border-color:rgba(244,238,223,.16)}
.pcard .field label{color:rgba(244,238,223,.85)}
.pcard .btn.ghost{color:var(--ivory);border-color:rgba(244,238,223,.2)}
.up{color:var(--up);font-weight:800}.down{color:var(--down);font-weight:800}
.pcard .up{color:#F2785E}.pcard .down{color:#52C996}
.cmp{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cmp div{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14.5px}
.pcard .cmp div{background:rgba(244,238,223,.06)}
.cmp b{font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:rgba(242,194,48,.14);color:var(--accent-ink);font-weight:700;font-size:14px}

.card .price.mk{color:var(--ink)}
.card .price.mk span{color:var(--muted)}
.card .cmp div{background:var(--surface-2)}
/* Courbe de l'historique */
.chart{margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .sale{fill:none;stroke:var(--gold-line);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--gold-line);opacity:.12}
.chart .buyl{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4}
.chart .avg{stroke:var(--accent-ink);stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--gold-line);stroke-width:2}
.chart .last{fill:var(--gold-line)}
.chart text{fill:var(--muted);font-family:var(--sans);font-size:10.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--gold-line);vertical-align:middle;margin-right:6px}
.legend i.b{border-top:1.6px dashed var(--muted)}.legend i.a{border-top:1.6px dotted var(--accent-ink)}

/* Historique : une frise chronologique */
.hist{list-style:none;margin:0;padding:0}
.hist li{position:relative;display:flex;justify-content:space-between;gap:12px;padding:12px 0 12px 22px;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0;padding-top:2px}
.hist li::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.hist li::after{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.hist li:first-child::after{top:8px;background:var(--gold);border-color:var(--gold)}
.hist .v{font-family:var(--serif);font-weight:700;font-size:17px;font-variant-numeric:lining-nums tabular-nums}
.hist time{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.now{font-size:11.5px;font-weight:800;color:var(--accent-ink);margin-left:6px}

/* ---------- Navigation : la barre flottante ---------- */
nav.tabs{flex:none;padding:8px 14px 10px;background:var(--bg)}
nav.tabs[hidden]{display:none}
.navpill{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;background:var(--chrome);border-radius:24px;padding:6px 8px 8px;box-shadow:0 16px 32px -16px rgba(0,0,0,.6)}
.navpill button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 2px;border:0;background:none;color:rgba(244,238,223,.6);font-size:12px;font-weight:800}
.navpill button svg{width:23px;height:23px}
.navpill button[aria-current="page"]{color:var(--gold)}
.navpill .scanbtn{gap:5px;color:var(--ivory)}
.navpill .scanbtn span.o{display:grid;place-items:center;width:60px;height:60px;margin-top:-30px;border-radius:50%;background:var(--gold);color:#17140F;box-shadow:0 0 0 5px var(--bg),0 12px 24px -8px rgba(224,169,30,.95)}
.navpill .scanbtn span.o svg{width:27px;height:27px}

/* ---------- Caméra ---------- */
#cam{position:fixed;inset:0;z-index:50;background:#000;flex-direction:column}
#cam:not([hidden]){display:flex}
#cam video{flex:1;width:100%;min-height:0;object-fit:cover}
.frame{position:absolute;left:10%;right:10%;top:36%;height:22%;border:2.5px solid var(--gold);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.camtxt{position:absolute;left:0;right:0;top:calc(36% - 64px);text-align:center;color:#fff;font-weight:800;line-height:1.35;padding:0 20px}
.cambar{flex:none;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}

#toast{position:fixed;left:16px;right:16px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;max-width:520px;margin:0 auto;padding:13px 15px;border-radius:14px;background:var(--chrome);color:var(--ivory);border-left:4px solid var(--gold);font-weight:700;font-size:14.5px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
#toast[hidden]{display:none}

/* ---------- Accueil : connexion ---------- */
.hero{background:var(--chrome);color:var(--ivory);border-radius:26px;padding:30px 22px 22px;text-align:center;border:1px solid rgba(242,194,48,.22)}
.hero b{display:block;font-family:var(--serif);font-style:italic;font-weight:700;font-size:40px;letter-spacing:.3em;margin-right:-.3em;color:var(--gold);text-shadow:0 0 22px rgba(242,194,48,.35)}
.hero span{display:block;margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.3em;color:rgba(244,238,223,.8)}
.hero .tiles{margin:20px -22px 0;background-position:center 0}
.hero p{margin:16px 0 0;font-size:14px;color:rgba(244,238,223,.72)}

/* ---------- Tablette ---------- */
@media (min-width:900px){
  #app{display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "tiles tiles" "nav main"}
  .top{grid-area:top;padding:16px 28px}
  #app>.tiles{grid-area:tiles}
  main{grid-area:main}
  nav.tabs{grid-area:nav;background:var(--chrome);padding:26px 10px}
  .navpill{grid-template-columns:1fr;grid-auto-rows:auto;gap:22px;background:none;box-shadow:none;padding:0}
  .navpill .scanbtn{order:-1}
  .navpill .scanbtn span.o{margin-top:0;box-shadow:0 12px 24px -10px rgba(224,169,30,.95)}
  .wrap{max-width:1080px;padding:32px 40px 56px}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
  .pgrid>.col>.h2:first-child{margin-top:18px}
  .list.cols{display:grid;grid-template-columns:1fr 1fr}
  .list.cols .item{border-top:1px solid var(--line)}
  .list.cols .item:nth-child(odd){border-right:1px solid var(--line)}
  .list.cols .item:nth-child(-n+2){border-top:0}
  .chips{margin:14px 0 0;padding:0 0 4px;flex-wrap:wrap;overflow:visible}
  #toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){.pill.sync i,.vf-zone .beam{animation:none}.btn{transition:none}}

/* ===== 2.0.1 : échelle plus fine, bouton de scan au premier plan, menu des réglages ===== */
body{font-size:15px}
.mark b{font-size:18px;letter-spacing:.26em}
.mark span{font-size:9.5px;margin-top:4px;letter-spacing:.24em}
.tiles{height:9px;background-image:linear-gradient(90deg,var(--brass) 0 6px,transparent 6px 9px);background-size:9px 6px}
.wrap{padding:18px 16px 32px}
.h1{font-size:23px;margin:2px 0 12px}
.h2{font-size:17px;margin:24px 0 6px}
.ptitle{font-size:21px;margin:2px 0 8px}
.lead{font-size:13.5px}
.card{padding:16px;border-radius:18px}
.pcard{padding:16px;border-radius:18px;margin-top:14px}
.price{font-size:40px;margin:8px 0 6px}
.price span{font-size:13px}
.price.sm{font-size:28px}
.plabel{font-size:12.5px}
.sub{font-size:13px}
.buy strong{font-size:19px;white-space:nowrap}
.hist .v{font-size:15px}
.item{min-height:56px;padding:11px 14px;gap:12px}
.item .nm{font-size:14.5px}

function normTxt(t){return ' '+String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim()+' ';}
function guessRayon(text){
  var t=normTxt(text),best=null,score=0;
  RKEYS.forEach(function(r){
    var sc=0;
    r[1].forEach(function(k){var kk=normTxt(k);if(kk.length>2&&t.indexOf(kk)>=0)sc+=kk.length;});
    if(sc>score){score=sc;best=r[0];}
  });
  return best;
}

function getRayon(id){
  var v=val(id);

  var name=val(id+'-new').replace(/\s+/g,' ').trim();

/* ================= utilitaires ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function dh(n){return fmt(n)+' DH';}
function num(s){s=String(s==null?'':s).replace(/\s/g,'').replace(',','.');if(s==='')return null;var v=Number(s);return isFinite(v)?Math.round(v*100)/100:NaN;}
function toNum(v){return v==null?null:Number(v);}
function dateFr(iso){return new Date(iso).toLocaleString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function dayFr(iso){return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}
function nowIso(){return new Date().toISOString();}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  var h=Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

function validEan(c){
  if(!/^\d+$/.test(c)||[8,12,13,14].indexOf(c.length)<0)return false;
  var d=c.split('').map(Number),chk=d.pop(),s=0;
  d.reverse().forEach(function(x,i){s+=x*(i%2===0?3:1);});
  return (10-s%10)%10===chk;
}

/* ================= synchronisation ================= */
function setSync(state,msg){S.sync={state:state,msg:msg||''};renderPill();if(S.view==='settings')render();}
function chk(res){if(res&&res.error)throw res.error;return res;}
var syncing=false,again=false;
function sync(){
  if(!sb||S.screen!=='app')return;
  if(syncing){again=true;return;}
  if(!navigator.onLine){setSync('offline');return;}
  syncing=true;setSync('sync');
  flush().then(pull).then(purgeTrash).then(function(){setSync(S.outbox.length?'pending':'ok');})
  .catch(function(e){setSync(navigator.onLine?'error':'offline',e&&e.message?e.message:String(e));})
  .then(function(){syncing=false;if(again){again=false;sync();}});
}
/* Efface côté serveur les produits restés plus de 30 jours dans la corbeille */
function purgeTrash(){
  return sb.rpc('mb_purge_deleted').then(function(){return reconcile();},function(){}).then(function(){saveLocal();render();});

function flush(){
  var ops=S.outbox.slice();
  if(!ops.length)return Promise.resolve();
  var prods=ops.filter(function(o){return o.type==='product';}).map(function(o){return o.row;});
  var ups=ops.filter(function(o){return o.type==='product_update';});
  var prs=ops.filter(function(o){return o.type==='price';}).map(function(o){return o.row;});
  var p=Promise.resolve();
  if(prods.length)p=p.then(function(){return sb.from('products').upsert(prods,{onConflict:'ean',ignoreDuplicates:true}).then(chk);});
  ups.forEach(function(u){p=p.then(function(){return sb.from('products').update(u.patch).eq('ean',u.ean).then(chk);});});
  if(prs.length)p=p.then(function(){return sb.from('prices').upsert(prs,{onConflict:'client_id',ignoreDuplicates:true}).then(chk);});
  return p.then(function(){
    var done={};ops.forEach(function(o){if(o.type!=='market'&&o.type!=='archive'&&o.type!=='trash'&&o.type!=='product_delete')done[o.id]=1;});
    S.outbox=S.outbox.filter(function(o){return !done[o.id];});
    var sent={};prs.forEach(function(r){sent[r.client_id]=1;});
    S.prices.forEach(function(x){if(sent[x.client_id])delete x.pending;});
    prods.forEach(function(r){if(S.products[r.ean])delete S.products[r.ean].pending;});
    saveLocal();
  }).then(function(){
    var side=ops.filter(function(o){return o.type==='archive'||o.type==='trash'||o.type==='product_delete';});
    var q=Promise.resolve();
    side.forEach(function(o){
      q=q.then(function(){
        var call=o.type==='archive'?sb.from('products').update({archived_at:o.archived_at}).eq('ean',o.ean)
          :o.type==='trash'?sb.from('products').update({deleted_at:o.deleted_at}).eq('ean',o.ean)
          :sb.rpc('mb_delete_product',{p_ean:o.ean});
        return call.then(chk).then(function(){S.outbox=S.outbox.filter(function(x){return x.id!==o.id;});saveLocal();})
          .catch(function(e){
            if(!navigator.onLine)return;
            if(!o.warned){o.warned=true;saveLocal();toast('Le serveur a refusé l’action : '+((e&&e.message)?e.message:'erreur inconnue')+'. Elle sera retentée.');}
          });
      });
    });
    return q;
  }).then(function(){
    var mks=ops.filter(function(o){return o.type==='market';});
    if(!mks.length)return;
    var rows=mks.map(function(o){return o.row;});
    /* Le carnet du marché ne doit jamais bloquer le reste : en cas d'échec, il reste en attente */
    return sb.from('market_prices').upsert(rows,{onConflict:'client_id',ignoreDuplicates:true}).then(chk).then(function(){
      var d2={};mks.forEach(function(o){d2[o.id]=1;});
      S.outbox=S.outbox.filter(function(o){return !d2[o.id];});
      var sent={};rows.forEach(function(r){sent[r.client_id]=1;});
      S.market.forEach(function(x){if(sent[x.client_id])delete x.pending;});
      saveLocal();
    }).catch(function(){});
  });
}
function pullTable(table,col,since){
  var all=[],page=0,size=1000;
  function next(){
    var q=sb.from(table).select('*');
    if(since)q=q.gte(col,since);
    q=q.order(col,{ascending:true}).range(page*size,page*size+size-1);
    return q.then(chk).then(function(r){var d=r.data||[];all=all.concat(d);if(d.length===size){page++;return next();}return all;});
  }
  return next();
}
function pull(){
  var lp=getJ(K.pull)||{};
  return pullTable('products','updated_at',lp.products).then(function(rows){
    rows.forEach(function(r){
      var loc=S.products[r.ean];
      var hasPendingEdit=S.outbox.some(function(o){return o.type==='product_update'&&o.ean===r.ean;});
      if(!hasPendingEdit||!loc)S.products[r.ean]={ean:r.ean,name:r.name,brand:r.brand||'',rayon:r.rayon,source:r.source,created_at:r.created_at,updated_at:r.updated_at,archived_at:r.archived_at||null,deleted_at:r.deleted_at||null};
    });
    if(rows.length)lp.products=rows[rows.length-1].updated_at;
    return pullTable('prices','created_at',lp.prices);
  }).then(function(rows){
    var idx={};S.prices.forEach(function(p,i){idx[p.client_id]=i;});
    rows.forEach(function(r){
      var x={client_id:r.client_id,ean:r.ean,sale_price:toNum(r.sale_price),purchase_price:toNum(r.purchase_price),note:r.note||'',recorded_at:r.recorded_at};
      if(idx[r.client_id]!=null)S.prices[idx[r.client_id]]=x;else{idx[r.client_id]=S.prices.length;S.prices.push(x);}
    });
    if(rows.length)lp.prices=rows[rows.length-1].created_at;
    return pullMarket(lp).then(reconcile).then(function(){setJ(K.pull,lp);saveLocal();render();});
  });
}
function reconcile(){
  /* Liste complète des codes du serveur : retire localement les produits supprimés ailleurs */
  var all=[],page=0,size=1000;
  function next(){
    return sb.from('products').select('ean').range(page*size,page*size+size-1).then(chk).then(function(r){
      var d=r.data||[];all=all.concat(d);if(d.length===size){page++;return next();}
      var on={};all.forEach(function(x){on[x.ean]=1;});
      var pend={};S.outbox.forEach(function(o){if(o.type==='product')pend[o.row.ean]=1;});
      Object.keys(S.products).forEach(function(e){
        if(!on[e]&&!pend[e]){delete S.products[e];S.prices=S.prices.filter(function(x){return x.ean!==e||x.pending;});S.market=S.market.filter(function(x){return x.ean!==e||x.pending;});}
      });
    });
  }
  return next().catch(function(){});
}
function pullMarket(lp){
  return pullTable('market_prices','created_at',lp.market).then(function(rows){
    var idx={};S.market.forEach(function(p,i){idx[p.client_id]=i;});
    rows.forEach(function(r){
      var x={client_id:r.client_id,ean:r.ean,source:r.source,price:toNum(r.price),note:r.note||'',recorded_at:r.recorded_at};
      if(idx[r.client_id]!=null)S.market[idx[r.client_id]]=x;else{idx[r.client_id]=S.market.length;S.market.push(x);}
    });
    if(rows.length)lp.market=rows[rows.length-1].created_at;
    S.marketReady=true;setJ(K.mk,true);
  }).catch(function(){/* table pas encore créée sur le serveur : le carnet reste masqué */});
}

/* ================= nom automatique (bases publiques) ================= */
var BASES=[
  {url:'https://world.openfoodfacts.org',rayon:'Alimentation',nom:'Open Food Facts'},
  {url:'https://world.openbeautyfacts.org',rayon:'Hygiène et cosmétique',nom:'Open Beauty Facts'},
  {url:'https://world.openproductsfacts.org',rayon:null,nom:'Open Products Facts'},
  {url:'https://world.openpetfoodfacts.org',rayon:null,nom:'Open Pet Food Facts'}
];
function fetchT(url,ms){
  return new Promise(function(ok,ko){
    var done=false,t=setTimeout(function(){if(!done){done=true;ko(new Error('timeout'));}},ms);
    fetch(url).then(function(r){if(done)return;done=true;clearTimeout(t);ok(r);},function(e){if(done)return;done=true;clearTimeout(t);ko(e);});
  });
}
function withBrand(name,brand){
  name=String(name||'').trim();brand=String(brand||'').trim();
  if(brand&&name.toLowerCase().indexOf(brand.toLowerCase())<0)return brand+' '+name;
  return name;
}
function ensureAi(){
  if(S.aiChecked||!sb||!navigator.onLine)return Promise.resolve();
  S.aiChecked=true;
  return callIdentify({action:'status'}).then(function(r){
    S.ai=(r.ok&&r.data)?{photo:!!r.data.photo,lookup:!!r.data.lookup,goupc:!!r.data.goupc,eansearch:!!r.data.eansearch,known:true}:{photo:false,lookup:false,goupc:false,eansearch:false,known:true};
    setJ(K.ai,S.ai);
  });
}
function callIdentify(body){
  if(!sb||!sb.functions)return Promise.resolve({ok:false,status:0});
  return sb.functions.invoke('identifier',{body:body}).then(function(r){
    if(r&&r.error){var st=(r.error.context&&r.error.context.status)||0;return {ok:false,status:st};}
    return {ok:true,data:r.data||{}};
  }).catch(function(){return {ok:false,status:0};});
}
/* Place le rayon détecté dans le sélecteur, sans écraser un choix du gérant */
function setRayonField(id,rayon){
  var ry=document.getElementById(id);if(!ry||S.rayonTouched||!rayon)return;
  var ok=false;Array.prototype.forEach.call(ry.options,function(o){if(o.value===rayon)ok=true;});
  if(!ok){var o=document.createElement('option');o.textContent=rayon;o.value=rayon;ry.insertBefore(o,ry.querySelector('option[value="__new"]'));}
  ry.value=rayon;ry.classList.remove('need');updateRayonNew();
}
function setStep(code,txt){
  var L=S.lookup[code];if(L&&L.state==='loading')L.step=txt;
  if(S.view==='new'&&S.ean===code){var box=document.getElementById('lk');if(box&&L&&L.state==='loading')box.outerHTML=lookupBox(code);}
}
function queryBase(b,code){
  return fetchT(b.url+'/api/v2/product/'+code+'.json?fields=product_name,product_name_fr,brands,quantity,categories,product_type',6000)
    .then(function(r){return r.json();})
    .then(function(j){
      var p=j&&j.status===1&&j.product;
      var name=p&&(p.product_name_fr||p.product_name||'').trim();
      if(!name)return {ok:true,found:false,base:b};
      if(p.quantity&&name.toLowerCase().indexOf(String(p.quantity).toLowerCase())<0)name+=' '+String(p.quantity).trim();
      var brd=(p.brands||'').split(',')[0].trim();
      var full=withBrand(name,brd);
      /* Rayon : d'abord le nom et la catégorie, puis le type de produit, puis la base */
      var ry=guessRayon(full+' '+(p.categories||''));
      if(!ry){var pt=p.product_type;ry=pt==='beauty'?'Hygiène et cosmétique':pt==='food'?(b.rayon||'Alimentation'):b.rayon;}
      return {ok:true,found:true,base:b,name:full,brand:brd,rayon:ry||null};
    }).catch(function(){return {ok:false,found:false,base:b};});
}
function lookup(code){
  if(S.lookup[code]&&S.lookup[code].state!=='offline')return;
  if(!navigator.onLine){S.lookup[code]={state:'offline'};return;}
  S.lookup[code]={state:'loading',step:'Open Food, Beauty et Products Facts'};
  var tried=[];
  function after(){
    if(S.view!=='new'||S.ean!==code)return;
    var L=S.lookup[code];
    if(L.state==='found'){
      var n=document.getElementById('n-name');if(n&&!n.value)n.value=L.name;
      var br=document.getElementById('n-brand');if(br&&!br.value)br.value=L.brand;
      setRayonField('n-rayon',L.rayon);
    }
    var box=document.getElementById('lk');if(box)box.outerHTML=lookupBox(code);
  }
  /* 1) les 3 bases ouvertes, lancées ensemble ; en cas de doublon, l'ordre alimentation, beauté, droguerie décide */
  Promise.all(BASES.map(function(b){return queryBase(b,code);})).then(function(res){
    for(var i=0;i<res.length;i++){
      if(res[i].found){
        S.lookup[code]={state:'found',name:res[i].name,brand:res[i].brand,rayon:res[i].rayon,source:res[i].base.nom};
        return after();
      }
    }
    res.forEach(function(r){tried.push(r.base.nom+(r.ok?'':' (injoignable)'));});
    /* 2) bases complémentaires, côté serveur, seulement si l'option est installée */
    setStep(code,'bases complémentaires');
    return ensureAi().then(function(){
      if(!S.ai.lookup){S.lookup[code]={state:'notfound',tried:tried};return after();}
      return callIdentify({action:'lookup',ean:code}).then(function(r){
        if(r.ok&&r.data.found){
          var nm=withBrand(r.data.name,r.data.brand);
          S.lookup[code]={state:'found',name:nm,brand:r.data.brand||'',rayon:guessRayon(nm+' '+(r.data.category||'')),source:r.data.source||'Base complémentaire'};
          return after();
        }
        if(r.ok&&r.data.tried)tried=tried.concat(r.data.tried);
        else tried.push('bases complémentaires (injoignables)');
        S.lookup[code]={state:'notfound',tried:tried};
        return after();
      });
    });
  });
}
function lookupBox(code){
  var L=S.lookup[code]||{state:'loading'};
  if(L.state==='loading')return '<p class="info" id="lk">Recherche du nom : '+esc(L.step||'bases publiques')+'…</p>';
  if(L.state==='found'&&L.ai)return '<div id="lk"><p class="warn">Proposé par l’IA d’après la photo ('+esc(L.confidence||'confiance non précisée')+'). Vérifiez le nom, le format et le rayon avant d’enregistrer.</p></div>';
  if(L.state==='found')return '<p class="ok" id="lk">Nom trouvé automatiquement ('+esc(L.source)+'). Vérifiez-le avant d’enregistrer.</p>';
  if(L.state==='offline')return '<p class="info" id="lk">Hors ligne : saisissez le nom. Il sera reconnu aux prochains scans.</p>';
  var srcs=(L.tried&&L.tried.length?' ('+esc(L.tried.join(', '))+')':'');
  if(S.ai.photo)return '<div id="lk"><p class="info">Nom introuvable'+srcs+'. Photographiez l’emballage pour le remplir automatiquement, ou saisissez le nom : il sera reconnu aux prochains scans.</p>'
    +'<div style="margin-top:10px"><button class="btn ghost" data-act="pphoto">Photographier l’emballage</button></div></div>';
  return '<p class="info" id="lk">Nom introuvable'+srcs+'. Saisissez-le une fois : il sera reconnu aux prochains scans.</p>';
}

/* Photo de l'emballage lue par l'IA (via la fonction Supabase) */
function packPhoto(file){
  var code=S.ean;
  toast('Lecture de l’emballage…');
  loadImg(file).then(function(img){
    var k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
    var c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.8).split(',')[1];
  }).then(function(b64){
    return callIdentify({action:'photo',image:b64});
  }).then(function(r){
    if(S.view!=='new'||S.ean!==code)return;
    if(!r.ok){
      toast(r.status===404?'Lecture par IA pas encore installée sur le serveur.':r.status===401?'Reconnectez-vous puis réessayez.':'Lecture impossible : vérifiez le réseau et réessayez.');return;
    }
    var d=r.data;
    if(!d.found){
      toast(d.reason==='non_configure'?'Lecture par IA pas encore activée (clé manquante).':d.reason==='photo_trop_lourde'?'Photo trop lourde. Reprenez-la un peu plus loin.':'Texte illisible. Reprenez la photo, bien nette et de face.');return;
    }
    var full=withBrand(d.name,d.brand);
    S.lookup[code]={state:'found',ai:true,name:full,brand:d.brand||'',rayon:d.rayon||'Autre',confidence:d.confidence,source:d.source};
    var n=document.getElementById('n-name');if(n)n.value=full;
    var br=document.getElementById('n-brand');if(br)br.value=d.brand||'';
    var aiRayon=(d.rayon&&d.rayon!=='Autre')?d.rayon:guessRayon(full);
    S.lookup[code].rayon=aiRayon;S.rayonTouched=false;setRayonField('n-rayon',aiRayon);
    var box=document.getElementById('lk');if(box)box.outerHTML=lookupBox(code);
    toast('Proposition prête : vérifiez avant d’enregistrer.');
  }).catch(function(){toast('Photo illisible. Réessayez.');});
}
document.getElementById('pphoto').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(f)packPhoto(f);
});

function deltaTxt(cur,prev,field){
  if(!cur||!prev)return '';
  var a=cur[field],b=prev[field],d=a-b;if(Math.abs(d)<0.005)return '';
  var pc=b>0?' ('+(d>0?'+':'−')+Math.abs(Math.round(d/b*1000)/10).toLocaleString('fr-FR')+' %)':'';
  return '<span class="delta '+(d>0?'up':'down')+'">'+(d>0?'▲ +':'▼ −')+dh(Math.abs(d))+pc+'</span>';
}

var MK_DAYS=90;
function marketOf(ean){return S.market.filter(function(m){return m.ean===ean;}).sort(function(a,b){return b.recorded_at.localeCompare(a.recorded_at);});}
function marketStats(ean){
  var limit=Date.now()-MK_DAYS*864e5,seen={},list=[];
  marketOf(ean).forEach(function(m){
    var k=String(m.source).toLowerCase().replace(/\s+/g,' ').trim();
    if(seen[k]||new Date(m.recorded_at).getTime()<limit)return;
    seen[k]=1;list.push(m);
  });
  var out={list:list,n:list.length};
  if(list.length>=2){
    var sum=0,min=list[0],max=list[0];
    list.forEach(function(m){sum+=m.price;if(m.price<min.price)min=m;if(m.price>max.price)max=m;});
    out.avg=Math.round(sum/list.length*100)/100;out.min=min;out.max=max;
  }
  return out;
}
function gapTxt(mine,ref,label){
  var d=mine-ref;if(Math.abs(d)<0.005)return '<div>'+label+' : même prix que vous</div>';
  var pc=ref>0?' ('+(d>0?'+':'−')+Math.abs(Math.round(d/ref*1000)/10).toLocaleString('fr-FR')+' %)':'';
  return '<div>Votre prix de vente est <span class="'+(d>0?'up':'down')+'">'+(d>0?'+':'−')+dh(Math.abs(d))+pc+'</span> '+(d>0?'au-dessus':'en dessous')+' '+label+'</div>';
}

function hasHistory(ean){

/* Courbe de l'historique : prix de vente (or), prix d'achat (pointillés), moyenne du marché */
function priceChart(ean){
  var asc=function(a,b){return a.recorded_at.localeCompare(b.recorded_at);};
  var sales=S.prices.filter(function(p){return p.ean===ean&&p.sale_price!=null;}).sort(asc);
  var buys=S.prices.filter(function(p){return p.ean===ean&&p.purchase_price!=null;}).sort(asc);
  if(sales.length<2&&buys.length<2)return '';
  var st=marketStats(ean),vals=[];
  sales.forEach(function(p){vals.push(p.sale_price);});buys.forEach(function(p){vals.push(p.purchase_price);});
  if(st.avg!=null)vals.push(st.avg);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<0.01){mx+=1;mn=Math.max(0,mn-1);}
  var span=mx-mn;mx+=span*0.12;mn=Math.max(0,mn-span*0.12);
  var times=sales.concat(buys).map(function(p){return new Date(p.recorded_at).getTime();});
  var t0=Math.min.apply(null,times),t1=Math.max(Date.now(),t0+60000);
  var W=320,H=140,L=4,R=4,T=10,B=24;
  /* Prix saisis le même jour : on les espace régulièrement pour que la courbe reste lisible */
  var byIndex=(Math.max.apply(null,times)-t0)<6*3600e3,order=times.slice().sort(function(a,b){return a-b;});
  function X(t){
    if(byIndex){var i=order.indexOf(t),n=Math.max(order.length,2);return L+(i<0?n-1:i)/(n)*(W-L-R);}
    return L+(t-t0)/(t1-t0)*(W-L-R);
  }
  function Y(v){return T+(mx-v)/(mx-mn)*(H-T-B);}
  function steps(list,field){
    var d='',lastY=0;
    list.forEach(function(p,i){var x=X(new Date(p.recorded_at).getTime()),y=Y(p[field]);d+=i===0?'M'+x.toFixed(1)+' '+y.toFixed(1):'H'+x.toFixed(1)+'V'+y.toFixed(1);lastY=y;});
    return d+'H'+X(t1).toFixed(1);
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(sales.length?('Prix de vente : de '+dh(sales[0].sale_price)+' à '+dh(sales[sales.length-1].sale_price)):'Évolution du prix d’achat')+'">';
  if(sales.length>=1){
    var line=steps(sales,'sale_price');
    svg+='<path class="area" d="'+line+'V'+(H-B)+'H'+X(new Date(sales[0].recorded_at).getTime()).toFixed(1)+'Z"/>';
    if(buys.length>=1)svg+='<path class="buyl" d="'+steps(buys,'purchase_price')+'"/>';
    if(st.avg!=null)svg+='<line class="avg" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(st.avg).toFixed(1)+'" y2="'+Y(st.avg).toFixed(1)+'"/>';
    svg+='<path class="sale" d="'+line+'"/>';
    sales.forEach(function(p,i){var last=i===sales.length-1;svg+='<circle class="'+(last?'last':'dot')+'" cx="'+X(new Date(p.recorded_at).getTime()).toFixed(1)+'" cy="'+Y(p.sale_price).toFixed(1)+'" r="'+(last?4.5:3.5)+'"/>';});
  } else {
    svg+='<path class="buyl" d="'+steps(buys,'purchase_price')+'"/>';
  }
  var d0=new Date(t0).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  svg+='<text x="'+L+'" y="'+(H-6)+'">'+esc(d0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">Aujourd’hui</text></svg>';
  var leg='<div class="legend"><span><i></i>Vente</span>'+(buys.length?'<span><i class="b"></i>Achat</span>':'')+(st.avg!=null?'<span><i class="a"></i>Moyenne du marché</span>':'')+'</div>';
  return '<div class="card chart"><p class="plabel">Évolution du prix</p>'+svg+leg+'</div>';
}

  if(S.formOpen){

      +'<div class="field"><label for="np-sale">Nouveau prix de vente</label><input id="np-sale" inputmode="decimal" placeholder="'+(sale.cur?fmt(sale.cur.sale_price):'0,00')+'"></div></div>'
      +'<div class="cmp" id="cmp"></div>'

  h+='</div>';
  h+=vMarket(ean);

  h+=priceChart(ean);
  if(!hist.length)h+='<p class="info">Aucun prix enregistré.</p>';
  else{

      var parts=[];

      if(x.purchase_price!=null)parts.push('Achat <b class="v">'+dh(x.purchase_price)+'</b>');
      h+='<li><div><div>'+parts.join('<br>')+'</div>'+(x.note?'<div class="small">'+esc(x.note)+'</div>':'')

    });

var dlgCb=null;
function askConfirm(o){
  document.getElementById('dlg-t').textContent=o.title;
  document.getElementById('dlg-x').textContent=o.text||'';
  var ok=document.getElementById('dlg-ok');ok.textContent=o.ok||'Confirmer';ok.className='btn'+(o.danger?' dangerfill':'');
  dlgCb=o.onOk;document.getElementById('dlg').hidden=false;ok.focus();
}
function closeDlg(run){
  var d=document.getElementById('dlg');if(d.hidden)return;
  d.hidden=true;var cb=dlgCb;dlgCb=null;if(run&&cb)cb();
}
function daysLeft(p){return Math.max(0,Math.ceil(TRASH_DAYS-(Date.now()-new Date(p.deleted_at).getTime())/864e5));}
function archiveProduct(on){
  var ean=S.ean,p=S.products[ean];if(!p)return;
  function run(){
    p.archived_at=on?nowIso():null;
    queue({type:'archive',ean:ean,archived_at:p.archived_at});
    S.reset=true;render();toast(on?'Produit archivé. Son historique est conservé.':'Produit restauré.');
  }
  if(!on){run();return;}
  askConfirm({title:'Archiver ce produit ?',text:'« '+p.name+' » disparaîtra de la liste. Son historique est conservé et vous pourrez le restaurer.',ok:'Archiver',onOk:run});
}
/* Supprimer : le produit va dans la corbeille 30 jours (restaurable), puis il est effacé avec son historique */
function deleteProduct(){
  var ean=S.ean,p=S.products[ean];if(!p)return;
  askConfirm({title:'Supprimer ce produit ?',
    text:'« '+p.name+' » ira dans la corbeille pendant '+TRASH_DAYS+' jours : vous pourrez le restaurer. Passé ce délai, il sera supprimé définitivement avec son historique de prix.',
    ok:'Confirmer la suppression',danger:true,onOk:function(){
      var pending=S.outbox.some(function(o){return o.type==='product'&&o.row.ean===ean;});
      if(pending){purgeLocal(ean);toast('Produit supprimé.');go(S.from==='product'?'scan':S.from);return;}
      p.deleted_at=nowIso();
      S.outbox=S.outbox.filter(function(o){return !(o.type==='trash'&&o.ean===ean);});
      queue({type:'trash',ean:ean,deleted_at:p.deleted_at});
      toast('Produit envoyé dans la corbeille ('+TRASH_DAYS+' jours).');go(S.from==='product'?'scan':S.from);
    }});
}
function restoreTrash(){
  var ean=S.ean,p=S.products[ean];if(!p)return;
  p.deleted_at=null;
  S.outbox=S.outbox.filter(function(o){return !(o.type==='trash'&&o.ean===ean);});
  queue({type:'trash',ean:ean,deleted_at:null});
  S.reset=true;render();toast('Produit restauré.');
}
function purgeLocal(ean){
  S.outbox=S.outbox.filter(function(o){return !((o.type==='product'&&o.row.ean===ean)||((o.type==='price'||o.type==='market')&&o.row.ean===ean)||((o.type==='product_update'||o.type==='archive'||o.type==='trash')&&o.ean===ean));});
  S.prices=S.prices.filter(function(x){return x.ean!==ean;});S.market=S.market.filter(function(x){return x.ean!==ean;});
  delete S.products[ean];delete S.lookup[ean];saveLocal();
}
function purgeNow(){
  var ean=S.ean,p=S.products[ean];if(!p||!p.deleted_at)return;
  var n=S.prices.filter(function(x){return x.ean===ean;}).length+S.market.filter(function(x){return x.ean===ean;}).length;
  askConfirm({title:'Supprimer définitivement ?',text:'« '+p.name+' » et ses '+n+' prix enregistrés seront effacés pour toujours. Cette action ne peut pas être annulée.',ok:'Supprimer définitivement',danger:true,onOk:function(){
    purgeLocal(ean);queue({type:'product_delete',ean:ean});toast('Produit supprimé définitivement.');go('list');
  }});
}
function cmpLine(label,cur,v){
  if(v==null)return '';
  if(isNaN(v)||v<0)return '<div class="up">'+label+' : montant invalide</div>';
  if(cur==null)return '<div>'+label+' : <b>'+dh(v)+'</b> (premier prix)</div>';
  var d=v-cur;
  if(Math.abs(d)<0.005)return '<div>'+label+' : identique, <b>'+dh(v)+'</b></div>';
  var pc=cur>0?' ('+(d>0?'+':'−')+Math.abs(Math.round(d/cur*1000)/10).toLocaleString('fr-FR')+' %)':'';
  return '<div>'+label+' : '+dh(cur)+' → <b>'+dh(v)+'</b> <span class="'+(d>0?'up':'down')+'">'+(d>0?'+':'−')+dh(Math.abs(d))+pc+'</span></div>';
}
function formChanges(){
  var ean=S.ean,sc=lastOf(ean,'sale_price').cur,bc=lastOf(ean,'purchase_price').cur;
  var s=num(val('np-sale')),b=num(val('np-buy'));
  var curS=sc?sc.sale_price:null,curB=bc?bc.purchase_price:null;
  var out={html:cmpLine('Achat',curB,b)+cmpLine('Vente',curS,s),sale:null,buy:null,invalid:false};
  if(s!=null&&(isNaN(s)||s<=0))out.invalid=true;
  if(b!=null&&(isNaN(b)||b<0))out.invalid=true;
  if(!out.invalid){
    if(s!=null&&(curS==null||Math.abs(s-curS)>=0.005))out.sale=s;
    if(b!=null&&(curB==null||Math.abs(b-curB)>=0.005))out.buy=b;
  }
  return out;
}
function updateCmp(){
  var box=document.getElementById('cmp'),btn=document.getElementById('np-save');if(!box||!btn)return;
  var c=formChanges();
  box.innerHTML=c.html;
  btn.disabled=c.invalid||(c.sale==null&&c.buy==null);
  if(!c.invalid&&c.sale==null&&c.buy==null&&(val('np-sale')||val('np-buy')))box.innerHTML+='<div>Aucun changement : rien à enregistrer.</div>';
}

function rayonCounts(){
  var c={},tot=0,arch=0,trash=0;
  Object.keys(S.products).forEach(function(e){
    var p=S.products[e];
    if(p.deleted_at){trash++;return;}
    if(p.archived_at){arch++;return;}
    tot++;var r=p.rayon||'Sans rayon';c[r]=(c[r]||0)+1;
  });
  return {by:c,total:tot,archived:arch,trash:trash};
}

    if(S.rayon==='Corbeille'){if(!p.deleted_at)return false;}
    else if(S.rayon==='Archivés'){if(!p.archived_at||p.deleted_at)return false;}
    else{if(p.archived_at||p.deleted_at)return false;if(S.rayon!=='Tous'&&p.rayon!==S.rayon)return false;}

function render(){
  var keep={values:{},focus:null,sel:null};
  if(!S.reset){
    $view.querySelectorAll('input,select,textarea').forEach(function(el){if(el.id&&el.type!=='file')keep.values[el.id]=el.value;});
    var a=document.activeElement;
    if(a&&a.id&&$view.contains(a)){keep.focus=a.id;try{keep.sel=[a.selectionStart,a.selectionEnd];}catch(e){}}
  }
  S.reset=false;
  var html;
  if(S.screen==='boot')html=vBoot();
  else if(S.screen==='setup')html=vSetup();
  else if(S.screen==='login')html=vLogin();
  else html={scan:vScan,product:vProduct,'new':vNew,list:vList,settings:vSettings}[S.view]();
  $view.innerHTML=html;
  Object.keys(keep.values).forEach(function(id){var el=document.getElementById(id);if(el&&keep.values[id]!=='')el.value=keep.values[id];});
  if(keep.focus){var el=document.getElementById(keep.focus);if(el){el.focus();try{if(keep.sel&&keep.sel[0]!=null)el.setSelectionRange(keep.sel[0],keep.sel[1]);}catch(e){}}}
  if(S.view==='product'&&S.formOpen)updateCmp();
  updateRayonNew();
  renderTabs();renderPill();
}

  S.view=view;if(ean!==undefined)S.ean=ean;

function handleCode(raw){
  if(S.screen!=='app')return;
  var code=String(raw||'').replace(/\D/g,'');
  if(!code){S.view='scan';S.msg='Saisissez ou scannez un code-barre (chiffres uniquement).';S.reset=true;render();return;}
  if(code.length<8||code.length>14){S.view='scan';S.msg='Code-barre invalide : il faut entre 8 et 14 chiffres.';S.reset=true;render();return;}
  S.msg='';
  if(S.products[code]){go('product',code);return;}
  lookup(code);
  go('new',code);
}

function login(){
  var mail=val('l-mail').trim(),pass=val('l-pass');
  if(!mail||!pass){S.msg='Saisissez l’email et le mot de passe.';render();return;}
  if(!navigator.onLine){S.msg='Connexion internet nécessaire pour se connecter.';render();return;}
  S.busy=true;S.msg='';render();
  sb.auth.signInWithPassword({email:mail,password:pass}).then(function(r){
    S.busy=false;
    if(r.error){S.msg=/invalid/i.test(r.error.message)?'Email ou mot de passe incorrect.':r.error.message;render();return;}
    S.email=mail;S.screen='app';S.reset=true;go('scan');sync();
  }).catch(function(){S.busy=false;S.msg='Connexion impossible. Vérifiez le réseau.';render();});
}
function create(){
  var ean=S.ean,name=val('n-name').trim();
  if(!name){toast('Indiquez le nom du produit.');return;}
  var sale=num(val('n-sale')),buy=num(val('n-buy'));
  if(sale==null&&buy==null){toast('Indiquez au moins un prix : achat ou vente.');return;}
  if(sale!=null&&(isNaN(sale)||sale<=0)){toast('Le prix de vente doit être un nombre supérieur à 0.');return;}
  if(buy!=null&&(isNaN(buy)||buy<0)){toast('Le prix d’achat n’est pas un nombre valide.');return;}
  var L=S.lookup[ean]||{};
  var rayon=getRayon('n-rayon');
  if(rayon===null){toast('Indiquez le nom du nouveau rayon (40 lettres au maximum).');return;}
  if(!rayon){toast('Choisissez le rayon du produit.');var se=document.getElementById('n-rayon');if(se)se.focus();return;}
  var prod={ean:ean,name:name,brand:val('n-brand').trim(),rayon:rayon,source:L.state==='found'&&L.name===name?L.source:'manuel'};
  S.products[ean]=Object.assign({created_at:nowIso(),pending:true},prod);
  var row={client_id:uuid(),ean:ean,sale_price:sale,purchase_price:buy,note:val('n-note').trim()||null,recorded_at:nowIso()};
  S.prices.push(Object.assign({pending:true},row,{note:row.note||''}));
  S.outbox.push({id:uuid(),type:'product',row:prod});
  queue({type:'price',row:row});
  toast('Produit enregistré.');
  go('product',ean,'scan');
}
function savePrice(){
  var c=formChanges();
  if(c.invalid){toast('Un des montants n’est pas valide.');return;}
  if(c.sale==null&&c.buy==null){toast('Prix identiques : rien à enregistrer.');return;}
  var row={client_id:uuid(),ean:S.ean,sale_price:c.sale,purchase_price:c.buy,note:val('np-note').trim()||null,recorded_at:nowIso()};
  S.prices.push(Object.assign({pending:true},row,{note:row.note||''}));
  queue({type:'price',row:row});

/* Douchette : elle tape le code comme un clavier puis Entrée ou Tab */
var buf='',bufT=0;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheet();closeDlg(false);}
  var t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){
    if(t.id==='code'&&(e.key==='Enter'||e.key==='Tab')&&t.value.trim()){e.preventDefault();handleCode(t.value);}
    else if(t.id==='l-pass'&&e.key==='Enter'){e.preventDefault();login();}
    return;
  }
  var now=Date.now();if(now-bufT>400)buf='';bufT=now;
  if(/^\d$/.test(e.key))buf+=e.key;
  else if((e.key==='Enter'||e.key==='Tab')&&buf.length>=8){e.preventDefault();var c=buf;buf='';handleCode(c);}
});

var reader=null,camOn=false,nStream=null,nTimer=null;
var FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128'];
function Z(){return (window.ZXing&&window.ZXing.BrowserMultiFormatReader)?window.ZXing:null;}
function hints(){
  var z=Z(),H=new Map(),F=z.BarcodeFormat;
  H.set(z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  H.set(z.DecodeHintType.TRY_HARDER,true);return H;

function beep(){
  try{if(navigator.vibrate)navigator.vibrate(70);
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    var c=new C(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=1800;g.gain.value=0.08;o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+0.09);setTimeout(function(){c.close();},300);
  }catch(e){}
}
function stopCamera(){
  camOn=false;
  clearInterval(scanLoop);scanLoop=null;scanBusy=false;
  if(reader){try{reader.reset();}catch(e){}reader=null;}
  clearInterval(nTimer);nTimer=null;
  if(nStream){nStream.getTracks().forEach(function(t){t.stop();});nStream=null;}
  var v=document.getElementById('camv');if(v&&v.srcObject){try{v.srcObject.getTracks().forEach(function(t){t.stop();});}catch(e){}v.srcObject=null;}
  document.getElementById('cam').hidden=true;
}
function onCode(c){if(!c)return;stopCamera();beep();handleCode(c);}

var CONSTRAINTS={audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}};
var scanLoop=null,scanBusy=false,scanTick=0,mzReader=null,scanCanvas=null;
function modernOK(z){return !!(z&&z.MultiFormatReader&&z.HTMLCanvasElementLuminanceSource&&z.BinaryBitmap&&z.HybridBinarizer);}
function tuneTrack(stream){
  try{
    var t=stream.getVideoTracks()[0];if(!t||!t.getCapabilities)return;
    var cap=t.getCapabilities(),adv={};
    if(cap.focusMode&&cap.focusMode.indexOf('continuous')>=0)adv.focusMode='continuous';
    if(Object.keys(adv).length)t.applyConstraints({advanced:[adv]}).catch(function(){});
  }catch(e){}
}
/* Zones lues à tour de rôle : bande large, zone agrandie au centre, image tournée */
var SCAN_MODES=[
  {wf:1,hf:.5},{wf:.6,hf:.3},{wf:1,hf:1,rot:true},{wf:1,hf:1},{wf:.6,hf:.3,rot:true},{wf:.8,hf:.4}
];
function scanFrame(){
  var v=document.getElementById('camv');
  if(!camOn||scanBusy||!v||v.readyState<2||!v.videoWidth)return;
  scanBusy=true;
  try{
    var z=Z(),vw=v.videoWidth,vh=v.videoHeight;
    var m=SCAN_MODES[scanTick%SCAN_MODES.length];scanTick++;
    var sw=Math.round(vw*m.wf),sh=Math.round(vh*m.hf),sx=Math.round((vw-sw)/2),sy=Math.round((vh-sh)/2);
    var k=Math.min(1,1100/Math.max(sw,sh)),cw=Math.round(sw*k),ch=Math.round(sh*k);
    var c=scanCanvas,ctx=c.getContext('2d',{willReadFrequently:true});
    if(m.rot){c.width=ch;c.height=cw;ctx.translate(ch/2,cw/2);ctx.rotate(Math.PI/2);ctx.drawImage(v,sx,sy,sw,sh,-cw/2,-ch/2,cw,ch);}
    else{c.width=cw;c.height=ch;ctx.drawImage(v,sx,sy,sw,sh,0,0,cw,ch);}
    var bmp=new z.BinaryBitmap(new z.HybridBinarizer(new z.HTMLCanvasElementLuminanceSource(c)));
    var res=mzReader.decode(bmp);
    if(res&&camOn){scanBusy=false;onCode(res.getText());return;}
  }catch(e){/* aucun code dans cette image : normal, on réessaie */}
  scanBusy=false;
}
function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail();return;}
  var z=Z();
  if(!z){if('BarcodeDetector' in window){startNative();return;}
    toast('Module de scan indisponible (connexion nécessaire au premier lancement). Utilisez la saisie ou la douchette.');return;}
  if(!modernOK(z)){startLegacy(z);return;}
  navigator.mediaDevices.getUserMedia(CONSTRAINTS).then(function(stream){
    nStream=stream;camOn=true;
    var v=document.getElementById('camv');
    v.setAttribute('playsinline','');v.muted=true;v.srcObject=stream;
    document.getElementById('cam').hidden=false;
    v.play().catch(function(){});
    tuneTrack(stream);
    mzReader=new z.MultiFormatReader();mzReader.setHints(hints());
    scanCanvas=document.createElement('canvas');scanTick=0;scanBusy=false;
    scanLoop=setInterval(scanFrame,130);
  }).catch(camFail);
}
function startLegacy(z){
  var v=document.getElementById('camv');
  document.getElementById('cam').hidden=false;camOn=true;
  try{
    reader=new z.BrowserMultiFormatReader(hints(),250);
    reader.decodeFromConstraints(CONSTRAINTS,v,function(res){if(res&&camOn)onCode(res.getText());}).catch(camFail);
  }catch(e){camFail(e);}
}
function supported(){
  return Promise.resolve(window.BarcodeDetector.getSupportedFormats?window.BarcodeDetector.getSupportedFormats():FORMATS)
    .catch(function(){return FORMATS;}).then(function(sup){return FORMATS.filter(function(x){return sup.indexOf(x)>=0;});});
}
function startNative(){
  supported().then(function(ok){
    if(!ok.length)throw new Error('formats');
    var det=new window.BarcodeDetector({formats:ok});
    return navigator.mediaDevices.getUserMedia(CONSTRAINTS).then(function(stream){
      nStream=stream;camOn=true;
      var v=document.getElementById('camv');v.srcObject=stream;
      document.getElementById('cam').hidden=false;v.play().catch(function(){});
      var busy=false;
      nTimer=setInterval(function(){
        if(busy||v.readyState<2)return;busy=true;
        det.detect(v).then(function(r){busy=false;if(r&&r.length&&camOn)onCode(r[0].rawValue);}).catch(function(){busy=false;});
      },250);
    });
  }).catch(camFail);
}
function loadImg(file){
  return new Promise(function(ok,ko){var u=URL.createObjectURL(file),i=new Image();
    i.onload=function(){ok(i);setTimeout(function(){URL.revokeObjectURL(u);},1000);};i.onerror=ko;i.src=u;});
}
function toCanvas(img,rot){
  var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  w=Math.round(w*k);h=Math.round(h*k);
  var c=document.createElement('canvas'),x=c.getContext('2d');
  if(rot){c.width=h;c.height=w;x.translate(h/2,w/2);x.rotate(Math.PI/2);x.drawImage(img,-w/2,-h/2,w,h);}
  else{c.width=w;c.height=h;x.drawImage(img,0,0,w,h);}
  return c;
}
function nativeRead(c){
  if(!('BarcodeDetector' in window))return Promise.resolve(null);
  return supported().then(function(ok){if(!ok.length)return null;
    return new window.BarcodeDetector({formats:ok}).detect(c).then(function(r){return r&&r.length?r[0].rawValue:null;});})
    .catch(function(){return null;});
}
function zxRead(c){
  var z=Z();if(!z)return Promise.resolve(null);
  try{return new z.BrowserMultiFormatReader(hints()).decodeFromImageUrl(c.toDataURL('image/jpeg',0.92))
    .then(function(r){return r?r.getText():null;}).catch(function(){return null;});}
  catch(e){return Promise.resolve(null);}
}
function readPhoto(file){
  toast('Lecture du code-barre…');
  loadImg(file).then(function(img){
    var c0=toCanvas(img,false);
    return nativeRead(c0).then(function(r){return r||zxRead(c0);})
      .then(function(r){if(r)return r;var c1=toCanvas(img,true);return nativeRead(c1).then(function(x){return x||zxRead(c1);});});
  }).then(function(code){
    if(code)onCode(code);
    else toast('Aucun code-barre lu. Reprenez la photo plus près, code net et entier dans l’image.');
  }).catch(function(){toast('Photo illisible. Réessayez.');});
}
document.getElementById('photo').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(f)readPhoto(f);
});

/* ================= démarrage ================= */
function boot(){
  loadLocal();
  var cfg=getJ(K.cfg);
  if(!cfg){S.screen='setup';S.reset=true;render();return;}
  if(!window.supabase||!window.supabase.createClient){
    /* Bibliothèque non chargée (hors ligne au tout premier lancement) : on travaille en local */
    S.screen='app';S.sync={state:'offline',msg:''};S.reset=true;render();return;
  }
  sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'mb-auth'}});
  sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s){S.email=(s.user&&s.user.email)||'';S.screen='app';S.reset=true;render();sync();}
    else{S.screen='login';S.reset=true;render();}
  }).catch(function(){S.screen='login';S.reset=true;render();});
}
window.addEventListener('online',function(){sync();});
window.addEventListener('offline',function(){if(S.screen==='app')setSync('offline');});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')sync();});
setInterval(function(){if(document.visibilityState==='visible')sync();},60000);

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
render();
boot();
})();
</script>
